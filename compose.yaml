name: lime-and-lemon

services:
  db:
    image: lime-and-lemon-postgres:17
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres-init
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lime_and_lemon
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 5432 is left to a local PostgreSQL service.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Ready only after the init scripts ran (the init-phase server listens on the socket only, not TCP).
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=127.0.0.1 --username=postgres --dbname=lime_and_lemon --quiet
          && psql --host=127.0.0.1 --username=postgres --dbname=lime_and_lemon
          --tuples-only --no-align --command='SELECT 1 FROM products LIMIT 1' | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: lime-and-lemon-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/products >/dev/null
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s

volumes:
  pg_data:
